# Opens an issue when a quarter has passed with no recorded trial restore (FR-028, SC-010).
# A record is a file ops/restore-tests/YYYY-MM-DD.md dated inside the previous quarter.
name: Restore test reminder

on:
  schedule:
    # 06:00 UTC on the first day of January, April, July and October.
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for a record in the previous quarter
        id: record
        run: |
          set -euo pipefail
          year=$(date -u +%Y)
          month=$((10#$(date -u +%m)))
          quarter=$(( (month - 1) / 3 + 1 ))
          if [ "$quarter" -eq 1 ]; then prev_year=$((year - 1)); prev_quarter=4; else prev_year=$year; prev_quarter=$((quarter - 1)); fi
          first=$(( (prev_quarter - 1) * 3 + 1 ))

          found=""
          for offset in 0 1 2; do
            prefix=$(printf '%04d-%02d' "$prev_year" $((first + offset)))
            match=$(ls ops/restore-tests/ 2>/dev/null | grep -E "^${prefix}-[0-9]{2}\.md$" | head -n 1 || true)
            if [ -n "$match" ]; then found="$match"; break; fi
          done

          echo "quarter=${prev_year} Q${prev_quarter}" >> "$GITHUB_OUTPUT"
          echo "found=${found}" >> "$GITHUB_OUTPUT"
          echo "Previous quarter: ${prev_year} Q${prev_quarter}; record: ${found:-none}"
      - name: Open a reminder
        if: steps.record.outputs.found == ''
        env:
          GH_TOKEN: ${{ github.token }}
          QUARTER: ${{ steps.record.outputs.quarter }}
        run: |
          gh issue create \
            --title "No restore test recorded for ${QUARTER}" \
            --body "No file dated in ${QUARTER} was found in \`ops/restore-tests/\`. A trial restore is required every quarter (spec 001, FR-028). Follow \`ops/runbooks/restore.md\`, then add the record from \`ops/restore-tests/TEMPLATE.md\`."
