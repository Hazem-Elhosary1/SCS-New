openapi: 3.0.3
info:
  title: Smart Clinic OS — audit trail reading (spec 007)
  version: 0.7.0
  description: >
    The clinic's reading of its audit trail. No screen in this spec; spec 059 builds
    «سجل الأنشطة والأمان» on it. Errors are problem details as everywhere (spec 001).
paths:
  /v1/audit/entries:
    get:
      summary: A page of the clinic's audit entries, newest first, with the counts per category.
      description: >
        Needs the permission reports.activity. Returns entries of the signed-in person's clinic
        whose actor is one of its people, and the sign-in entries on its accounts. Entries by the
        platform or an operator are never returned. Words are in the language of Accept-Language.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Start of the period. Default ninety days before `to`. }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: End of the period. Default now. }
        - { name: category, in: query, schema: { type: string, enum: [security, changes, records, users] } }
        - { name: actor, in: query, schema: { type: string, format: uuid }, description: An account of the clinic. }
        - { name: action, in: query, schema: { type: string }, description: An action code of the catalogue. }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Part of the actor's name or of the action's name in the reader's language. }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400':
          description: >
            VALIDATION_FAILED — `from` after `to` (period: INVALID), a period longer than 366 days
            (period: TOO_LONG), an unknown category or action (INVALID), a page or size out of range.
        '401': { description: UNAUTHENTICATED }
        '403': { description: PERMISSION_REQUIRED with permission reports.activity }
components:
  schemas:
    AuditPage:
      type: object
      required: [from, to, total, counts, page, size, entries]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        total: { type: integer, description: Entries matching the period and every facet. }
        counts:
          type: object
          description: Entries in the period matching every facet except the category.
          required: [all, security, changes, records, users]
          properties:
            all: { type: integer }
            security: { type: integer }
            changes: { type: integer }
            records: { type: integer }
            users: { type: integer }
        page: { type: integer }
        size: { type: integer }
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
    AuditEntry:
      type: object
      required: [id, occurredAt, category, action, sentence, actor]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        category: { type: string, enum: [security, changes, records, users] }
        action:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string, description: In the reader's language. }
        sentence: { type: string, description: The describing sentence, in the reader's language. }
        actor:
          type: object
          required: [known]
          properties:
            known: { type: boolean, description: False for a failed sign-in, where nobody is known to have acted. }
            accountId: { type: string, format: uuid, nullable: true }
            name: { type: string, nullable: true, description: The display name at the moment. }
        target:
          type: object
          nullable: true
          properties:
            kind: { type: string }
            id: { type: string, format: uuid, nullable: true }
            name: { type: string, nullable: true }
            exists: { type: boolean, description: False when an account target no longer exists. }
        ipAddress: { type: string, nullable: true, description: Always in Latin digits. }
        device: { type: string, nullable: true, description: 'In the reader''s language: «متصفح Chrome على Windows».' }
        attempts: { type: integer, nullable: true, description: For signin.failed-run. }
        locked: { type: boolean, nullable: true, description: For signin.failed-run. }
