openapi: 3.1.0
info:
  title: SCS Identity — passwords and account activation
  version: 1.0.0
  description: >
    Additions of spec 004 to the Identity API of spec 003. Conventions (problem details, trace
    reference, error codes, `X-Scs-Request`) are those of spec 001 and spec 003. The first three
    paths need no session; they share the sign-in request limit (ten a minute per network
    address) and answer `429 RATE_LIMITED` with `Retry-After` beyond it.
paths:
  /v1/auth/password/forgot:
    post:
      summary: Ask for a reset link
      description: >
        Always answers 202 with an empty body, never sooner than a fixed floor, whatever the
        address and whether or not anything will be sent. Mail is sent in the background, only to
        an active account, at most one a minute and five an hour per account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        '202': { description: Accepted. Says nothing about the address. }
        '400':
          description: The email is empty or malformed. Field `email` — `REQUIRED`, `INVALID_FORMAT`, `TOO_LONG`.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/password/link:
    post:
      summary: Inspect a link without using it
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkToken' }
      responses:
        '200':
          description: The link is live.
          content:
            application/json:
              schema:
                type: object
                required: [kind, email]
                properties:
                  kind: { $ref: '#/components/schemas/LinkKind' }
                  email: { type: string, description: The account the link belongs to. }
                  clinicNameAr: { type: string, description: Only for `new-account`. }
                  clinicNameEn: { type: string, description: Only for `new-account`. }
        '410': { $ref: '#/components/responses/LinkInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/password/link/set:
    post:
      summary: Set the password with a link, using it up
      description: >
        Checks in order: the link; the password rules; that it differs from the current
        password. A refused password leaves the link live. On success no session is opened and no
        cookie is set. For `reset`: the lock is lifted, every session of the account ends, every
        link stops working, a notice email is queued. For `new-account`: the account becomes
        active.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LinkToken'
                - $ref: '#/components/schemas/NewPassword'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [kind]
                properties:
                  kind: { $ref: '#/components/schemas/LinkKind' }
        '410': { $ref: '#/components/responses/LinkInvalid' }
        '400': { $ref: '#/components/responses/PasswordRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/password/change:
    post:
      summary: Replace a temporary password
      description: >
        Needs a session whose account is marked "must change". The person stays signed in with
        the same session; their other sessions end. Allowed while the mark stands.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204': { description: Changed. The mark is removed. }
        '401': { description: As spec 003 — `UNAUTHENTICATED`, `ACCESS_EXPIRED`, `SESSION_ENDED`. }
        '409':
          description: '`PASSWORD_CHANGE_NOT_REQUIRED` — the account is not marked. Changing an ordinary password is spec 085.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '400': { $ref: '#/components/responses/PasswordRefused' }
  /v1/auth/session:
    get:
      summary: Who is signed in (spec 003) — one new field
      description: Allowed while the mark stands.
      responses:
        '200':
          description: As spec 003, plus the field below.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mustChangePassword:
                    type: boolean
                    description: True while the account holds a temporary password.
components:
  schemas:
    LinkKind:
      type: string
      enum: [reset, new-account]
    LinkToken:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 1024, description: Taken from the fragment of the emailed address. Never logged. }
    NewPassword:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 200, description: Never logged. }
    Problem:
      type: object
      description: Problem details of spec 001 — `type`, `title`, `status`, `code`, `traceId`, and `errors` for field refusals.
      properties:
        code: { type: string }
        traceId: { type: string }
  responses:
    RateLimited:
      description: '`RATE_LIMITED`, with `Retry-After` in seconds.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    LinkInvalid:
      description: >
        `LINK_INVALID`. The link is expired, used, replaced, never issued or altered, or its
        account can no longer use it. The problem carries `kind` so the right screen is shown; a
        token that cannot be read is answered with `kind: reset`. Nothing says which reason.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                required: [kind]
                properties:
                  kind: { $ref: '#/components/schemas/LinkKind' }
    PasswordRefused:
      description: >
        `VALIDATION_FAILED` on field `password`, one code per unmet rule: `REQUIRED`, `TOO_SHORT`,
        `TOO_LONG`, `NO_UPPER_LOWER`, `NO_DIGIT`, `NO_SYMBOL`; or `SAME_AS_CURRENT` alone when the
        rules are met but the password equals the current one.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
